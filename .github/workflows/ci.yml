name: CI

# Portão de qualidade em todo PR (e reaproveitado pelo deploy.yml).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build

  e2e:
    needs: qualidade
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test --reporter=line
        env:
          CI: '1'
          HOME: /root
