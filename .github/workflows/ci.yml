name: CI

# Portão de qualidade em todo PR (e reaproveitado pelo deploy.yml). Os dois jobs rodam ao mesmo tempo.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
      # No deploy (fora de PR), este dist/ é o que vai para o GitHub Pages: o build é um só.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test --reporter=line
        env:
          CI: '1'
          HOME: /root
